<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Рубик-Башня</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #1c2233 0%, #080a10 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }
    #canvas-container { position: fixed; inset: 0; }
    #canvas-container canvas { display: block; touch-action: none; }

    #hud {
        position: fixed; top: 0; left: 0; right: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px 16px;
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        pointer-events: none; z-index: 10;
    }
    #hud-label {
        font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
        color: rgba(255,255,255,0.35); font-weight: 600;
    }
    #progress-track {
        width: 220px; max-width: 60vw; height: 6px;
        background: rgba(255,255,255,0.07); border-radius: 3px;
        overflow: hidden; border: 1px solid rgba(255,255,255,0.06);
    }
    #progress-fill {
        height: 100%; width: 100%;
        background: linear-gradient(90deg, #00e87a, #00c8ff);
        border-radius: 3px;
        transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 0 8px rgba(0, 232, 122, 0.6);
    }
    #progress-value {
        font-size: 22px; font-weight: 800; color: #00e87a;
        letter-spacing: 0.5px; font-variant-numeric: tabular-nums;
        text-shadow: 0 0 14px rgba(0, 232, 122, 0.35);
        transition: color 0.3s, text-shadow 0.3s;
    }
    #progress-value.solved {
        color: #ffd23f; text-shadow: 0 0 20px rgba(255, 210, 63, 0.7);
    }

    #controls {
        position: fixed; bottom: 0; left: 0; right: 0;
        padding: 16px 16px max(24px, env(safe-area-inset-bottom));
        display: flex; justify-content: center; gap: 10px;
        z-index: 10; pointer-events: none;
    }
    .btn {
        appearance: none; pointer-events: auto;
        background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.9);
        border: 1px solid rgba(255,255,255,0.14);
        padding: 12px 22px; font-size: 13px; font-weight: 600;
        letter-spacing: 0.5px; border-radius: 10px; cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.1s;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.28); }
    .btn:active { transform: scale(0.95); }
    .btn.accent {
        background: rgba(0, 232, 122, 0.15); border-color: rgba(0, 232, 122, 0.45);
        color: #b8ffdd;
    }
    .btn.accent:hover { background: rgba(0, 232, 122, 0.25); }

    #hint {
        position: fixed; bottom: 90px; left: 0; right: 0;
        text-align: center; font-size: 11px;
        color: rgba(255,255,255,0.3); letter-spacing: 0.5px;
        pointer-events: none; z-index: 5;
        transition: opacity 1s; padding: 0 24px; line-height: 1.4;
    }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>

<div id="hud">
    <div id="hud-label">Прогресс сборки</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-value">100%</div>
</div>

<div id="hint">6 квадратов — это один кубик, показанный с 6 сторон.<br>Один свайп меняет все 6 сразу.</div>

<div id="controls">
    <button class="btn accent" id="btn-scramble">Перемешать</button>
    <button class="btn" id="btn-reset">Сбросить</button>
</div>

<script>
(function () {
    'use strict';

    /* ============================================================
       CONFIG
    ============================================================ */
    const CUBE_GAP           = 3.5;
    const FRUSTUM_SIZE       = 22;
    const SAVE_KEY           = 'rubiks_tower_v2';
    const MAX_MANHATTAN      = 60;
    const SWIPE_MIN_PX       = 28;
    const ANIM_DURATION_MS   = 280;   // smooth player move
    const SCRAMBLE_DURATION_MS = 130; // fast scramble step
    const SCRAMBLE_MOVES     = 16;

    const FACE_COLORS = [0x1e6fdb, 0x24a148, 0xf0f0f0, 0xf2c419, 0xd32f2f, 0xef7d1a];

    const ORIENTATIONS = [
        { name: 'ROOF',  rx:  Math.PI / 2, ry: 0           },
        { name: 'FRONT', rx:  0,           ry: 0           },
        { name: 'FLOOR', rx: -Math.PI / 2, ry: 0           },
        { name: 'BACK',  rx:  0,           ry: Math.PI     },
        { name: 'LEFT',  rx:  0,           ry: Math.PI / 2 },
        { name: 'RIGHT', rx:  0,           ry: -Math.PI / 2 }
    ];

    /* ============================================================
       SCENE
    ============================================================ */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
    camera.position.set(0, 0, 50);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.78));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.55);
    keyLight.position.set(6, 10, 18);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0x99bbff, 0.22);
    fillLight.position.set(-8, -4, 12);
    scene.add(fillLight);

    /* ============================================================
       CUBE
    ============================================================ */
    const materials = FACE_COLORS.map(hex => new THREE.MeshStandardMaterial({
        color: hex, roughness: 0.38, metalness: 0.02
    }));
    const pieceGeometry = new THREE.BoxGeometry(0.92, 0.92, 0.92);

    const cubes = [];
    function createCube(cubeIndex) {
        const group = new THREE.Group();
        let id = 0;
        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const piece = new THREE.Mesh(pieceGeometry, materials);
                    piece.position.set(x, y, z);
                    piece.userData = {
                        id: id++,
                        cubeIndex: cubeIndex,
                        initialPos: new THREE.Vector3(x, y, z)
                    };
                    group.add(piece);
                }
            }
        }
        return group;
    }

    const topY = (ORIENTATIONS.length - 1) * CUBE_GAP / 2;
    ORIENTATIONS.forEach((o, i) => {
        const cube = createCube(i);
        cube.position.y = topY - i * CUBE_GAP;
        cube.rotation.set(o.rx, o.ry, 0);
        scene.add(cube);
        cubes.push(cube);
    });

    /* ============================================================
       PROGRESS
    ============================================================ */
    function manhattanDistance() {
        const cube = cubes[1];
        let total = 0;
        for (const piece of cube.children) {
            if (!piece.isMesh) continue;
            const p = piece.position;
            const init = piece.userData.initialPos;
            total += Math.abs(Math.round(p.x) - init.x)
                   + Math.abs(Math.round(p.y) - init.y)
                   + Math.abs(Math.round(p.z) - init.z);
        }
        return total;
    }

    function isSolved() {
        const cube = cubes[1];
        for (const piece of cube.children) {
            if (!piece.isMesh) continue;
            const p = piece.position;
            const init = piece.userData.initialPos;
            if (Math.round(p.x) !== init.x ||
                Math.round(p.y) !== init.y ||
                Math.round(p.z) !== init.z) return false;
            const q = piece.quaternion;
            const w = Math.min(1, Math.abs(q.w));
            const angle = 2 * Math.acos(w);
            if (angle > 0.1) return false;
        }
        return true;
    }

    function calculateProgress() {
        if (isSolved()) return 100;
        const dist = manhattanDistance();
        const raw = 100 - (dist / MAX_MANHATTAN) * 100;
        return Math.max(0, Math.min(99, Math.round(raw)));
    }

    const elFill  = document.getElementById('progress-fill');
    const elValue = document.getElementById('progress-value');

    function updateProgressUI() {
        const pct = calculateProgress();
        elFill.style.width = pct + '%';
        elValue.textContent = pct + '%';
        elValue.classList.toggle('solved', pct >= 100);
    }

    /* ============================================================
       SAVE / LOAD
    ============================================================ */
    function saveGameState() {
        try {
            const payload = cubes.map(cube =>
                cube.children.filter(c => c.isMesh).map(piece => ({
                    id: piece.userData.id,
                    px: piece.position.x, py: piece.position.y, pz: piece.position.z,
                    qx: piece.quaternion.x, qy: piece.quaternion.y,
                    qz: piece.quaternion.z, qw: piece.quaternion.w
                }))
            );
            localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
        } catch (e) { /* ignore */ }
    }

    function loadGameState() {
        let raw;
        try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
        if (!raw) return false;
        try {
            const payload = JSON.parse(raw);
            if (!Array.isArray(payload) || payload.length !== cubes.length) return false;
            cubes.forEach((cube, ci) => {
                const cubeData = payload[ci];
                if (!Array.isArray(cubeData)) return;
                const lookup = new Map(cubeData.map(e => [e.id, e]));
                for (const piece of cube.children) {
                    if (!piece.isMesh) continue;
                    const saved = lookup.get(piece.userData.id);
                    if (saved) {
                        piece.position.set(saved.px, saved.py, saved.pz);
                        piece.quaternion.set(saved.qx, saved.qy, saved.qz, saved.qw);
                    }
                }
            });
            return true;
        } catch (e) { return false; }
    }

    /* ============================================================
       ANIMATION ENGINE (time-based, smooth)
    ============================================================ */
    const animationQueue = [];

    function easeOutCubic(t) {
        const u = 1 - t;
        return 1 - u * u * u;
    }

    function startLayerRotation(axis, layer, angle, opts) {
        opts = opts || {};
        const axisKey = axis.toLowerCase();
        const pivots = [];

        cubes.forEach(cube => {
            const pieces = [];
            for (const child of cube.children) {
                if (child.isMesh && Math.round(child.position[axisKey]) === layer) {
                    pieces.push(child);
                }
            }
            const pivot = new THREE.Group();
            cube.add(pivot);
            pieces.forEach(p => pivot.add(p));
            pivots.push({ cube, pivot });
        });

        animationQueue.push({
            pivots,
            axisKey,
            startAngle: 0,
            targetAngle: angle,
            startTime: null,
            duration: opts.isScrambling ? SCRAMBLE_DURATION_MS : ANIM_DURATION_MS,
            isScrambling: !!opts.isScrambling,
            targetCubeIndex: opts.targetCubeIndex !== undefined ? opts.targetCubeIndex : null
        });
    }

    /* ============================================================
       SWIPE → AXIS MAPPING
       Verified per-clone so that the swipe direction matches the
       visual motion on screen and — importantly — so that
       horizontal swipes on ROOF/FLOOR rotate a *perpendicular*
       slice (axis Z), not the visible face itself (axis Y).
    ============================================================ */
    function getSwipeParams(cubeIndex, dir) {
        const isRight = dir === 'RIGHT';
        const isDown  = dir === 'DOWN';
        const isHorizontal = isRight || dir === 'LEFT';

        let axis, layerCoord, sign;

        if (isHorizontal) {
            // Horizontal slice (spin around a horizontal axis)
            switch (cubeIndex) {
                case 0: axis = 'Z'; layerCoord = 'z'; sign = isRight ? -1 :  1; break; // ROOF
                case 2: axis = 'Z'; layerCoord = 'z'; sign = isRight ?  1 : -1; break; // FLOOR
                default: axis = 'Y'; layerCoord = 'y'; sign = isRight ?  1 : -1;      // FRONT/BACK/LEFT/RIGHT
            }
        } else {
            // Vertical slice
            switch (cubeIndex) {
                case 1: axis = 'X'; layerCoord = 'x'; sign = isDown ?  1 : -1; break; // FRONT
                case 3: axis = 'X'; layerCoord = 'x'; sign = isDown ? -1 :  1; break; // BACK
                case 4: axis = 'Z'; layerCoord = 'z'; sign = isDown ?  1 : -1; break; // LEFT
                case 5: axis = 'Z'; layerCoord = 'z'; sign = isDown ? -1 :  1; break; // RIGHT
                case 0: axis = 'X'; layerCoord = 'x'; sign = isDown ?  1 : -1; break; // ROOF
                case 2: axis = 'X'; layerCoord = 'x'; sign = isDown ?  1 : -1; break; // FLOOR
            }
        }
        return { axis, layerCoord, sign };
    }

    function performSwipe(piece, dir) {
        const cubeIndex = piece.userData.cubeIndex;
        const p = getSwipeParams(cubeIndex, dir);
        const layer = Math.round(piece.position[p.layerCoord]);
        const angle = p.sign * Math.PI / 2;

        startLayerRotation(p.axis, layer, angle, { targetCubeIndex: cubeIndex });
    }

    /* ============================================================
       INPUT
    ============================================================ */
    const raycaster = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    let pointerActive = false;
    let pointerStartX = 0, pointerStartY = 0;
    let activePiece = null;

    function onPointerDown(e) {
        if (pointerActive || animationQueue.length > 0) return;
        if (e.target && e.target.tagName === 'BUTTON') return;

        pointerActive = true;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
        activePiece = null;

        const rect = renderer.domElement.getBoundingClientRect();
        ndc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        ndc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
        const hits = raycaster.intersectObjects(scene.children, true);
        for (const hit of hits) {
            if (hit.object.userData && hit.object.userData.id !== undefined) {
                activePiece = hit.object;
                break;
            }
        }
        e.preventDefault();
    }

    function onPointerUp(e) {
        if (!pointerActive) return;
        pointerActive = false;
        const piece = activePiece;
        activePiece = null;
        if (!piece) return;

        const dx = e.clientX - pointerStartX;
        const dy = e.clientY - pointerStartY;
        if (Math.abs(dx) < SWIPE_MIN_PX && Math.abs(dy) < SWIPE_MIN_PX) return;

        let dir;
        if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'RIGHT' : 'LEFT';
        else                              dir = dy > 0 ? 'DOWN'  : 'UP';

        performSwipe(piece, dir);
    }

    function cancelPointer() { pointerActive = false; activePiece = null; }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', cancelPointer);

    /* ============================================================
       BUTTONS
    ============================================================ */
    document.getElementById('btn-scramble').addEventListener('click', () => {
        if (animationQueue.length > 0) return;
        const axes = ['X', 'Y', 'Z'];
        const layers = [-1, 0, 1];
        for (let i = 0; i < SCRAMBLE_MOVES; i++) {
            const axis  = axes[(Math.random() * 3) | 0];
            const layer = layers[(Math.random() * 3) | 0];
            const sign  = Math.random() < 0.5 ? 1 : -1;
            startLayerRotation(axis, layer, sign * Math.PI / 2, { isScrambling: true });
        }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        if (animationQueue.length > 0) return;
        try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
        location.reload();
    });

    /* ============================================================
       MAIN LOOP
    ============================================================ */
    function animate(now) {
        requestAnimationFrame(animate);
        now = now || performance.now();

        if (animationQueue.length > 0) {
            const task = animationQueue[0];
            if (task.startTime === null) task.startTime = now;

            const elapsed = now - task.startTime;
            const rawT = Math.min(elapsed / task.duration, 1);
            const eased = easeOutCubic(rawT);
            const angle = task.startAngle + (task.targetAngle - task.startAngle) * eased;

            for (const { pivot } of task.pivots) {
                pivot.rotation[task.axisKey] = angle;
            }

            // Visual focus on the target cube (only during player moves)
            if (!task.isScrambling && task.targetCubeIndex !== null) {
                const pulse = 1 + 0.04 * Math.sin(rawT * Math.PI);
                cubes.forEach((cube, i) => {
                    cube.scale.setScalar(i === task.targetCubeIndex ? pulse : 1);
                });
            }

            if (rawT >= 1) {
                // Finalize: snap to exact angle, return pieces to cube
                for (const { cube, pivot } of task.pivots) {
                    pivot.rotation[task.axisKey] = task.targetAngle;
                    pivot.updateMatrixWorld(true);
                    const pieces = pivot.children.slice();
                    for (const piece of pieces) {
                        cube.attach(piece);
                        piece.position.set(
                            Math.round(piece.position.x),
                            Math.round(piece.position.y),
                            Math.round(piece.position.z)
                        );
                    }
                    cube.remove(pivot);
                }
                if (!task.isScrambling) {
                    cubes.forEach(c => c.scale.setScalar(1));
                }
                animationQueue.shift();
                if (animationQueue.length === 0) {
                    saveGameState();
                    updateProgressUI();
                }
            }
        }

        renderer.render(scene, camera);
    }

    /* ============================================================
       RESIZE
    ============================================================ */
    function resize() {
        const w = window.innerWidth, h = window.innerHeight;
        const aspect = w / h;
        camera.left   = -FRUSTUM_SIZE * aspect / 2;
        camera.right  =  FRUSTUM_SIZE * aspect / 2;
        camera.top    =  FRUSTUM_SIZE / 2;
        camera.bottom = -FRUSTUM_SIZE / 2;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 100));

    /* ============================================================
       BOOT
    ============================================================ */
    resize();
    loadGameState();
    updateProgressUI();
    animate();

    setTimeout(() => {
        const hint = document.getElementById('hint');
        if (hint) hint.style.opacity = '0';
    }, 8000);

})();
</script>
</body>
</html>
